<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BPS TEST</title><style>*{box-sizing:border-box}body{margin:0;background:#101510;color:#f4fff4;font-family:system-ui;text-align:center;user-select:none;-webkit-user-select:none}header{padding:18px}h1{margin:0;font-size:25px;letter-spacing:3px}.stats{display:flex;justify-content:space-around;padding:12px;background:#202920}.stats strong{display:block;font-size:32px;color:#aaff53}.stats small{font-size:12px}#pad{height:58dvh;min-height:280px;margin:12px;border:2px solid #8bff40;border-radius:24px;background:#1e3b20;touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column}#pad:active{background:#345b2d}#pad b{font-size:30px}#pad span{opacity:.75;margin-top:8px}.controls{display:flex;gap:10px;margin:12px}button{flex:1;padding:15px;background:#aaff53;color:#132013;border:0;border-radius:12px;font-weight:800;font-size:16px}button.secondary{background:#333;color:white}#status{padding:4px}</style></head><body><header><h1>PAINTBALL BPS TEST</h1></header><div class="stats"><div><strong id="bps">0.0</strong><small>LIVE BPS</small></div><div><strong id="peak">0.0</strong><small>PEAK BPS</small></div><div><strong id="shots">0</strong><small>SHOTS</small></div><div><strong id="clock">10.0</strong><small>SECONDS</small></div></div><div id="pad"><b>WALK THE TRIGGER</b><span>Each finger tap = one ball</span></div><div class="controls"><button id="start">10-SECOND TEST</button><button class="secondary" id="reset">RESET / FREE FIRE</button></div><div id="status">Free fire mode</div><script>
const $=id=>document.getElementById(id);
let times=[],presses=0,releases=0,peak=0,active=new Set(),mode='free',deadline=0;
const pad=$('pad');
function draw(){
const now=performance.now(),rolling=times.filter(t=>t>now-1000).length;
peak=Math.max(peak,rolling);
$('bps').textContent=rolling.toFixed(1);
$('peak').textContent=peak.toFixed(1);
$('shots').textContent=times.length;
if(mode==='timed'){
let left=Math.max(0,(deadline-now)/1000);
$('clock').textContent=left.toFixed(1);
$('status').textContent='TEST RUNNING • '+left.toFixed(1)+'s • Presses '+presses+' / Releases '+releases;
if(left===0)finish();
}else if(mode==='free')$('status').textContent='FREE FIRE • Presses '+presses+' / Releases '+releases+' • Active '+active.size;
}
function finish(){mode='done';$('clock').textContent='0.0';$('status').textContent='FINISHED • '+(times.length/10).toFixed(1)+' average BPS • '+times.length+' balls';}
function down(id){if(active.has(id))return;active.add(id);if(mode==='done')return;let now=performance.now();if(mode==='timed'&&now>=deadline){finish();return;}presses++;times.push(now);draw();}
function up(id){if(active.delete(id))releases++;draw();}
pad.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)down('t'+t.identifier)},{passive:false});
for(const name of ['touchend','touchcancel'])pad.addEventListener(name,e=>{e.preventDefault();for(const t of e.changedTouches)up('t'+t.identifier)},{passive:false});
pad.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')down('p'+e.pointerId)});
for(const name of ['pointerup','pointercancel','pointerleave'])pad.addEventListener(name,e=>{if(e.pointerType!=='touch')up('p'+e.pointerId)});
function reset(){times=[];presses=0;releases=0;peak=0;active.clear();mode='free';deadline=0;$('clock').textContent='—';draw();}
$('start').onclick=()=>{reset();mode='timed';deadline=performance.now()+10000;draw()};
$('reset').onclick=reset;setInterval(draw,40);draw();
</script></body></html>
