<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BPS TEST</title><style>*{box-sizing:border-box}body{margin:0;background:#101510;color:#f4fff4;font-family:system-ui;text-align:center;user-select:none;-webkit-user-select:none}header{padding:18px}h1{margin:0;font-size:25px;letter-spacing:3px}.stats{display:flex;justify-content:space-around;padding:12px;background:#202920}.stats strong{display:block;font-size:32px;color:#aaff53}.stats small{font-size:12px}#pad{height:58dvh;min-height:280px;margin:12px;border:2px solid #8bff40;border-radius:24px;background:#1e3b20;touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column}#pad:active{background:#345b2d}#pad b{font-size:30px}#pad span{opacity:.75;margin-top:8px}.controls{display:flex;gap:10px;margin:12px}button{flex:1;padding:15px;background:#aaff53;color:#132013;border:0;border-radius:12px;font-weight:800;font-size:16px}button.secondary{background:#333;color:white}#status{padding:4px}</style></head><body><header><h1>PAINTBALL BPS TEST</h1></header><div class="stats"><div><strong id="bps">0.0</strong><small>LIVE BPS</small></div><div><strong id="peak">0.0</strong><small>PEAK BPS</small></div><div><strong id="shots">0</strong><small>SHOTS</small></div><div><strong id="clock">10.0</strong><small>SECONDS</small></div></div><div id="pad"><b>WALK THE TRIGGER</b><span>Each finger tap = one ball</span></div><div class="controls"><button id="start">10-SECOND TEST</button><button class="secondary" id="reset">RESET / FREE FIRE</button></div><div id="status">Free fire mode</div><script>const $=id=>document.getElementById(id);let times=[],peak=0,start=null,deadline=null,mode='free',finished=false;function reset(){times=[];peak=0;start=null;deadline=null;mode='free';finished=false;$('status').textContent='Free fire mode';draw()}function fire(n){if(finished)return;const t=performance.now();if(mode==='timed'&&t>=deadline){finish();return}for(let i=0;i<n;i++)times.push(t);draw()}function live(t){return times.filter(v=>v>t-1000).length}function draw(){const t=performance.now();let rate=live(t);peak=Math.max(peak,rate);$('bps').textContent=rate.toFixed(1);$('peak').textContent=peak.toFixed(1);$('shots').textContent=times.length;$('clock').textContent=mode==='timed'?Math.max(0,(deadline-t)/1000).toFixed(1):'—'}function finish(){finished=true;mode='done';$('clock').textContent='0.0';$('status').textContent='Finished: '+times.length+' balls • '+(times.length/10).toFixed(1)+' average BPS'}$('pad').addEventListener('touchstart',e=>{e.preventDefault();fire(e.changedTouches.length)},{passive:false});$('pad').addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')fire(1)});$('start').onclick=()=>{reset();mode='timed';start=performance.now();deadline=start+10000;$('status').textContent='GO!';draw()};$('reset').onclick=reset;setInterval(()=>{if(mode==='timed'&&performance.now()>=deadline)finish();else if(!finished)draw()},40);draw();</script></body></html>
